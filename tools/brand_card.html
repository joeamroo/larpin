<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px;
    background: #f4f2ee;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .logo { display: flex; align-items: center; }
  .word { font-size: 170px; font-weight: 700; color: #0a66c2; letter-spacing: -0.045em; line-height: 1; margin-right: 12px; position: relative; top: -6px; }
  .box {
    width: 204px; height: 204px; border-radius: 24px; background: #0a66c2;
    color: white; font-size: 128px; font-weight: 700; letter-spacing: -0.045em;
    display: flex; align-items: center; justify-content: center; padding-top: 6px; box-sizing: border-box;
  }
  .tag { margin-top: 54px; font-size: 46px; color: rgba(25,25,25,.72); font-weight: 500; }
  .url { margin-top: 26px; font-size: 38px; color: #0a66c2; font-weight: 700; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="logo"><span class="word">Larp</span><span class="box">in</span></div>
  <p class="tag">LinkedIn, but everyone admits they're larping.</p>
  <p class="url">larpin.io</p>
</body>
</html>
